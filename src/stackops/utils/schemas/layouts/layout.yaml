# yaml-language-server: $schema=./layout.schema.json

version: "0.2"
layouts:
  - layoutName: g1
    layoutTabs:
      - tabName: p51s
        tabWeight: 0
        panes:
          - paneName: p51s
            startDir: $HOME
            command: ls
      - tabName: hello
        tabWeight: 0
        panes:
          - paneName: hello
            startDir: $HOME
            command: uv run python -c 'import time; time.sleep(10); print("hello world")'
