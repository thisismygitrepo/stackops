# yaml-language-server: $schema=./dotfiles.schema.json
# Bundled settings file mappings
# os values are explicit YAML lists containing linux, darwin, or windows

# ============ Terminal Apps ============
wt_windows:
  settings:
    original: ~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json
    self_managed: CONFIG_ROOT/settings/shells/wt/settings.json
    os:
    - windows

