    original: ~/.copilot-cli-access-token
    self_managed: DOTFILES_ROOT/creds/llm/github_cli/.copilot-cli-access-token
    os:
    - linux
    - darwin
    - windows
aider:
  config:
    original: ~/.aider.conf.yml
    self_managed: DOTFILES_ROOT/creds/llm/aider/.aider.conf.yml
