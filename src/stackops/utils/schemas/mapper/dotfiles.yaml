    original: ~/.marvin/.env
    self_managed: DOTFILES_ROOT/creds/llm/marvin/.env
    os:
    - linux
    - darwin
    - windows
  threads:
    original: ~/.marvin/cli/threads/default.json
    self_managed: DOTFILES_ROOT/creds/llm/marvin/threads/default.json
    os:
    - linux
    - darwin
    - windows

# ============ Developer Tools ============
docker:
  config:
    original: ~/.docker/config.json
    self_managed: DOTFILES_ROOT/creds/docker/config.json
    os:
    - linux
    - darwin
    - windows

# ============ Email ============
himalaya:
  config:
    original: ~/.config/himalaya/config.toml
    self_managed: DOTFILES_ROOT/creds/himalaya/config.toml
    os:
    - linux
    - darwin
