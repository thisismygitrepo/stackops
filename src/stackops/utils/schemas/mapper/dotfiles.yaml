# yaml-language-server: $schema=./dotfiles.schema.json
# User-defined config file mappings
# os values are explicit YAML lists containing linux, darwin, or windows

# ============ Credentials And Secrets ============
git:
  gitconfig:
    original: ~/.gitconfig
    self_managed: DOTFILES_ROOT/creds/git/.gitconfig
    os:
    - linux
    - darwin
    - windows
  gitcred:
    original: ~/.git-credentials
    self_managed: DOTFILES_ROOT/creds/git/.git-credentials
    os:
    - linux
    - darwin
    - windows
ssh:
  keys:
    original: ~/.ssh
    self_managed: DOTFILES_ROOT/creds/.ssh
    contents: true
    os:
    - linux
    - darwin
    - windows
gpg:
  keys_unix:
    original: ~/.gnupg
    self_managed: DOTFILES_ROOT/creds/.gnupg
    contents: true
    os:
    - linux
    - darwin
  keys_windows:
    original: ~/AppData/Roaming/gnupg
    self_managed: DOTFILES_ROOT/creds/.gnupg
    contents: true
    os:
    - windows


pypi:
  creds:
    original: ~/.pypirc
    self_managed: DOTFILES_ROOT/creds/pypi/.pypirc
    os:
    - linux
    - darwin
    - windows
rclone:
  config_xdg:
    original: ~/.config/rclone/rclone.conf
    self_managed: DOTFILES_ROOT/creds/rclone/rclone.conf
    os:
    - linux
    - darwin
  config_windows:
    original: ~/AppData/Roaming/rclone/rclone.conf
    self_managed: DOTFILES_ROOT/creds/rclone/rclone.conf
    os:
    - windows
cloudflare:
  config:
    original: ~/.cloudflared
    self_managed: DOTFILES_ROOT/creds/cloudflare/.cloudflared
    os:
    - linux
    - darwin
    - windows
ngrok:
  config_linux:
    original: ~/.config/ngrok/ngrok.yml
    self_managed: DOTFILES_ROOT/creds/tokens/ngrok.yml
    os:
    - linux
    - darwin
  config_windows:
    original: ~/AppData/Local/ngrok/ngrok.yml
    self_managed: DOTFILES_ROOT/creds/tokens/ngrok.yml
    os:
    - windows
m365:
  config1:
    original: ~/.cli-m365-msal.json
    self_managed: DOTFILES_ROOT/creds/tokens/.cli-m365-msal.json
    os:
    - linux
    - darwin
    - windows
  config2:
    original: ~/.cli-m365-all-connections.json
    self_managed: DOTFILES_ROOT/creds/tokens/.cli-m365-all-connections.json
    os:
    - linux
    - darwin
    - windows
  config3:
    original: ~/.cli-m365-connection.json
    self_managed: DOTFILES_ROOT/creds/tokens/.cli-m365-connection.json
    os:
    - linux
    - darwin
    - windows
remmina:
  data:
    original: ~/.var/app/org.remmina.Remmina/data/remmina
    self_managed: DOTFILES_ROOT/creds/RDP/remmina/data/remmina
    os:
    - linux
    - darwin
    - windows
rustdesk_client:
  linux:
    original: ~/.config/rustdesk
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/client/config
    os:
    - linux
  windows:
    original: ~/AppData/Roaming/RustDesk/config
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/client/config
    os:
    - windows
  darwin:
    original: ~/Library/Preferences/com.carriez.RustDesk
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/client/config
    os:
    - darwin
rustdesk_client_service:
  linux:
    original: /root/.config/rustdesk
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/client_service/config
    os:
    - linux
  windows:
    original: C:/Windows/ServiceProfiles/LocalService/AppData/Roaming/RustDesk/config
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/client_service/config
    os:
    - windows
  darwin:
    original: /Library/Preferences/com.carriez.RustDesk
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/client_service/config
    os:
    - darwin
rustdesk_server:
  private_key:
    original: ~/rustdesk-server/data/id_ed25519
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/server/data/id_ed25519
    os:
    - linux
    - windows
  public_key:
    original: ~/rustdesk-server/data/id_ed25519.pub
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/server/data/id_ed25519.pub
    os:
    - linux
    - windows
  config:
    original: ~/rustdesk-server/data/.config
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/server/data/.config
    os:
    - linux
    - windows
  compose:
    original: ~/rustdesk-server/compose.yml
    self_managed: DOTFILES_ROOT/creds/RDP/rustdesk/server/compose.yml
    os:
    - linux
    - windows

# ============ Desktop Launchers ============
webapp_linux:
  brave:
    original: ~/.local/share/applications
    self_managed: DOTFILES_ROOT/config/webapps/linux/brave
    contents: true
    os:
    - linux
    - darwin

