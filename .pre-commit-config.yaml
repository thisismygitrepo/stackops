default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: uv-sync
        name: UV Sync
        entry: bash -c 'uv sync && git add uv.lock'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: pyright
        name: Pyright
        entry: uv run --locked --group dev pyright --threads src
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
