name: Build and Publish to PyPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # For testing the workflow on PRs, but won't publish

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      publish-needed: ${{ steps.check-version.outputs.publish-needed }}
      package-name: ${{ steps.check-version.outputs.package-name }}
      current-version: ${{ steps.check-version.outputs.current-version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Validate installer catalog
      run: uv run --group dev --frozen pytest -q tests/mirror/src/stackops/utils/schemas/installer/test_installer_data.py::test_installer_catalog_matches_schema_and_has_unique_app_names

    - name: Check if current version needs publishing
      id: check-version
      run: |
        uv run --no-sync python - <<'PY'
        import json
        import os
        import tomllib
        import urllib.error
        import urllib.parse
        import urllib.request
        from pathlib import Path

        output_path = Path(os.environ["GITHUB_OUTPUT"])
        pyproject = tomllib.loads(Path("pyproject.toml").read_text())
        project = pyproject["project"]
        package_name = project["name"]
        current_version = project["version"]

        package_url = urllib.parse.quote(package_name, safe="")
        pypi_url = f"""https://pypi.org/pypi/{package_url}/json"""

        try:
            with urllib.request.urlopen(pypi_url, timeout=20) as response:
                releases = json.load(response)["releases"]
                publish_needed = current_version not in releases
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
            publish_needed = True

        with output_path.open("a") as output_file:
            output_file.write(f"""package-name={package_name}\n""")
            output_file.write(f"""current-version={current_version}\n""")
            output_file.write(f"""publish-needed={str(publish_needed).lower()}\n""")

        if publish_needed:
            print(f"""{package_name} {current_version} is not on PyPI yet.""")
        else:
            print(f"""{package_name} {current_version} is already on PyPI.""")
        PY

  build-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Clean previous build artifacts
      run: |
        echo "🧹 Cleaning previous build artifacts..."
        rm -rf dist/ build/ *.egg-info/

    - name: Build package
      run: |
        echo "🔨 Building package..."
        uv build

    - name: List built artifacts
      run: |
        echo "📦 Listing built artifacts:"
        ls -la dist/

    - name: Install wheel in a clean environment
      run: |
        uv venv "$RUNNER_TEMP/stackops-wheel-check"
        uv pip install --python "$RUNNER_TEMP/stackops-wheel-check/bin/python" dist/*.whl

    - name: Check installed wheel
      working-directory: ${{ runner.temp }}
      env:
        PYTHONPATH: ''
      run: |
        "$RUNNER_TEMP/stackops-wheel-check/bin/python" -I - <<'PY'
        import importlib
        import json
        import subprocess
        import sys
        from importlib.metadata import distribution
        from importlib.resources import files
        from pathlib import Path

        import yaml

        console_scripts = sorted(
            (entry for entry in distribution("stackops").entry_points if entry.group == "console_scripts"),
            key=lambda entry: entry.name,
        )
        assert console_scripts, "The wheel contains no console scripts"
        for entry in console_scripts:
            print(f"Checking {entry.name} --help", flush=True)
            subprocess.run(
                [str(Path(sys.executable).parent.joinpath(entry.name)), "--help"],
                check=True,
                stdin=subprocess.DEVNULL,
                timeout=60,
            )

        prompts_root = files("stackops").joinpath("agents", "prompts")
        prompts: object = yaml.safe_load(prompts_root.joinpath("prompts.yaml").read_text(encoding="utf-8"))
        schema: object = json.loads(prompts_root.joinpath("prompts.schema.json").read_text(encoding="utf-8"))
        assert isinstance(prompts, dict) and prompts, "Bundled prompts must be a non-empty mapping"
        assert isinstance(schema, dict) and schema, "Bundled prompt schema must be a non-empty mapping"

        for module_name in (
            "stackops.utils.options_utils.textual_options_form",
            "stackops.scripts.python.helpers.helpers_agents.agent_impl_interactive.main",
        ):
            importlib.import_module(module_name)
        print("Installed wheel checks passed")
        PY

    - name: Upload verified distributions
      uses: actions/upload-artifact@v4
      with:
        name: verified-dist
        path: dist/*
        if-no-files-found: error

  publish:
    needs: [check-version, build-and-check]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.publish-needed == 'true' && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Download verified distributions
      uses: actions/download-artifact@v5
      with:
        name: verified-dist
        path: dist

    - name: Publish to PyPI
      env:
        PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: |
        if [ -n "$PYPI_TOKEN" ]; then
          echo "🚀 Publishing to PyPI with PYPI_TOKEN..."
          uv publish --token "$PYPI_TOKEN"
        else
          echo "🚀 Publishing to PyPI with trusted publishing..."
          uv publish --trusted-publishing always
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.check-version.outputs.current-version }}
        name: Release v${{ needs.check-version.outputs.current-version }}
        body: |
          ## Changes
          
          Version ${{ needs.check-version.outputs.current-version }} has been released and published to PyPI.
          
          Install with:
          ```bash
          pip install ${{ needs.check-version.outputs.package-name }}==${{ needs.check-version.outputs.current-version }}
          ```
          
          Or with uv:
          ```bash
          uv add ${{ needs.check-version.outputs.package-name }}==${{ needs.check-version.outputs.current-version }}
          ```
        files: |
          dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
